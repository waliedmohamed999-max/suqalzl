# gitleaks config (auto-loaded from the repo root by .github/workflows/security.yml).
# Default rules + a narrow allowlist for the documented DEV-ONLY local values
# (docker-compose.yml, .env.example, CI test env). Those services bind to
# 127.0.0.1 / exist only inside a CI runner. Never add a real-looking value here:
# if a real secret is found, rotate it, do not allowlist it.
[extend]
useDefault = true

[[allowlists]]
description = "dev-only local credentials (see docs/runbooks/local-dev.md)"
# stopwords match inside the extracted secret
stopwords = [
  '''_dev_only''',
  '''-dev-secret-change-me''',
  '''-dev-access''',
  '''postgres_ci_only''',
]

# False positives in test fixtures: fake captcha tokens and test-only HMAC fallbacks.
# Path-scoped on purpose: the rules stay active everywhere else (and in these files for
# any other finding). Do not widen this to a directory.
[[allowlists]]
description = "test fixtures with fake values (not secrets)"
paths = [
  '''^tests/components/login-forms\.test\.tsx$''',
  '''^tests/setup-env\.ts$''',
]
