# -----------------------------------------------------------------------------
# Souq AlZal — LOCAL DEVELOPMENT stack (P1-03). Not for staging/production:
# hosting is decided in P7/P8 (SPEC D12, O6). Every port is bound to 127.0.0.1.
#
#   docker compose up -d --wait          # infra only: postgres + storage + mail
#   docker compose --profile app up -d   # + the Next.js app and the local cron
#                                        #   trigger (works after P1-01 adds package.json)
#   docker compose down                  # stop (data kept in named volumes)
#   docker compose down -v               # stop AND delete all local data
#
# Values come from `.env` (copy of `.env.example`; `scripts/dev-setup.sh` makes it).
# Every variable has a dev default here so `docker compose config` works without it.
# Runbook: docs/runbooks/local-dev.md
# -----------------------------------------------------------------------------
name: suqalzl

x-node-app: &node-app
  # Keep the Node major in sync with .nvmrc and the CI (node-version-file: .nvmrc).
  image: node:24-bookworm-slim
  working_dir: /app
  env_file:
    - path: .env
      required: false
  volumes:
    - .:/app
    # node_modules lives in a Linux volume, never on the host: Windows/macOS hosts
    # would otherwise mix native binaries (Prisma engines, sharp) across OSes.
    - node_modules:/app/node_modules
    - next_cache:/app/.next
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: "no"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — same major as production. Debian image (not alpine) so the
  # default locale is en_US.utf8 like managed Postgres; keeps sorting/ctype equal.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-suqalzl}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
      TZ: UTC
      PGTZ: UTC
      # read by docker/postgres/init/10-roles-databases-extensions.sh
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-suqalzl_test}
      DB_APP_USER: ${DB_APP_USER:-suqalzl_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-suqalzl_app_dev_only}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-suqalzl_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-suqalzl_migrator_dev_only}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - max_connections=100
      # surface slow queries early (production alert threshold is p95 > 1.5 s)
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      # TCP (not the socket) so it only turns healthy after the init scripts have
      # finished and the real server is listening. Also proves the app role exists.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -p 5432 -U "$${DB_APP_USER}" -d "$${POSTGRES_DB}" &&
          PGPASSWORD="$${DB_APP_PASSWORD}" psql -h 127.0.0.1 -U "$${DB_APP_USER}" -d "$${POSTGRES_DB}" -tAc "select 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
      start_interval: 1s
    stop_grace_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # S3-compatible object storage: SeaweedFS `weed mini` (Apache-2.0, one process).
  # Why not MinIO: the community edition stopped publishing images/binaries
  # (Oct 2025) and the repository is archived (2026). See local-dev.md §7.
  # Buckets: suqalzl-public (anonymous read, product images) and suqalzl-private
  # (vendor documents, presigned URLs only). Bucket names are fixed for dev
  # because docker/seaweedfs/s3.json grants anonymous read to `suqalzl-public`.
  # The admin key comes from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY below.
  # ---------------------------------------------------------------------------
  storage:
    image: chrislusf/seaweedfs:4.54
    command:
      - mini
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=suqalzl-public,suqalzl-private
      - -s3.allowedOrigins=${APP_URL:-http://localhost:3000}
      - -master.telemetry=false # never send usage statistics out
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-suqalzl-dev-access}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-suqalzl-dev-secret-change-me}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweed_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit — catches every email sent in dev (SMTP :1025, web UI :8025).
  # Nothing leaves the machine. Resend is only used when EMAIL_PROVIDER=resend.
  # ---------------------------------------------------------------------------
  mail:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      TZ: UTC
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional, profile "app": run the Next.js app inside Docker (one command).
  # Needs P1-01 (package.json, prisma, seed). The faster default on Windows and
  # macOS is to run `npm run dev` on the host against the infra above.
  # Script names (db:migrate:deploy, db:seed, dev) are the contract in
  # docs/runbooks/notes-for-backend.md.
  # ---------------------------------------------------------------------------
  app:
    <<: *node-app
    profiles: ["app"]
    command:
      - sh
      - -c
      - >-
        test -f package.json || { echo 'package.json not found: run this after P1-01'; exit 1; } &&
        npm ci --no-audit --no-fund &&
        npm run db:migrate:deploy &&
        npm run db:seed &&
        npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      # Inside the container the services are reached by name, not localhost.
      DATABASE_URL: postgresql://${DB_APP_USER:-suqalzl_app}:${DB_APP_PASSWORD:-suqalzl_app_dev_only}@postgres:5432/${POSTGRES_DB:-suqalzl}
      DIRECT_URL: postgresql://${DB_MIGRATOR_USER:-suqalzl_migrator}:${DB_MIGRATOR_PASSWORD:-suqalzl_migrator_dev_only}@postgres:5432/${POSTGRES_DB:-suqalzl}
      S3_ENDPOINT: http://storage:8333
      # Browser-facing URLs (presigned + public) must stay on localhost.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      WATCHPACK_POLLING: "true" # file watching through bind mounts on Windows/macOS
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      mail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  # Local stand-in for Cloud Scheduler / Vercel Cron: calls POST /api/cron/<job>
  # with the CRON_SECRET bearer token (SPEC §2 Jobs/Cron, devops.md §6.5).
  cron:
    <<: *node-app
    profiles: ["app"]
    command: ["node", "scripts/dev-cron.mjs"]
    environment:
      DEV_CRON_TARGET_URL: http://app:3000
      TZ: UTC
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_data:
  mailpit_data:
  node_modules:
  next_cache:
